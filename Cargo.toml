[package]
name = "factory-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Generic OPC-UA gateway — exposes a factory's machines as a standard OPC UA for Machinery + ISA-95 Job Control address space"
repository = "https://github.com/joeblew999/factory-gateway"

[lib]
name = "factory_gateway"
path = "src/lib.rs"

[[bin]]
name = "factory-gateway"
path = "src/main.rs"

[dependencies]
factory-machine-model = { git = "https://github.com/joeblew999/factory-machine-model" }
factory-howick-driver = { git = "https://github.com/joeblew999/factory-howick-driver" }
async-opcua = { version = "0.18", features = ["server"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-opcua = { version = "0.18", features = ["server", "client"] }
